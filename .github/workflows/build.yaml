name: Build and Release

on:
  push:
    paths:
      - "version.txt"
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            asset: idgen-linux-amd64

          - os: ubuntu-24.04-arm
            asset: idgen-linux-arm64

          - os: macos-15-intel
            asset: idgen-darwin-amd64

          - os: macos-14
            asset: idgen-darwin-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: make release PROG=${{ matrix.asset }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set tag
        shell: bash
        run: |
          echo "TAG=$(cat version.txt | tr -d '\n')" >> "$GITHUB_ENV"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ env.TAG }}
          name: Release ${{ env.TAG }}
          artifacts: "dist/*"
          prerelease: true
          generateReleaseNotes: true
